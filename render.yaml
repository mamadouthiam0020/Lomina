services:
  - type: web
    name: lomina
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
    routes:
      # SPA fallback: let React Router handle all client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
